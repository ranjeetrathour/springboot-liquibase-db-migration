spring:
  application:
    name: liquibase-demo

  datasource:
    url: jdbc:mysql://localhost:3306/liquibase_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  liquibase:
    enabled: false
    change-log: src/main/resources/db/changelog/db.changelog-master.yaml